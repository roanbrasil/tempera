[project]
name = "tempera-worker"
version = "0.1.0"
description = "Têmpera Python worker: runs ML backends and emits JSONL events for the agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
dependencies = [
    "pyyaml>=6",
    "pyarrow>=17",
]

[project.optional-dependencies]
tabular = [
    "pyarrow>=17",
    "polars>=1.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "catboost>=1.2",
    "skl2onnx>=1.17",
    "onnxmltools>=1.12",
    "onnxruntime>=1.20",
    "pandas>=2.2",
    "joblib>=1.4",
]
vision = ["pyarrow>=17", "torch>=2.5", "timm>=1.0", "safetensors>=0.4", "onnx>=1.17"]
nlp = ["pyarrow>=17", "torch>=2.5", "transformers>=4.46", "safetensors>=0.4", "onnx>=1.17"]
llm = ["pyarrow>=17", "torch>=2.5", "transformers>=4.46", "peft>=0.13", "accelerate>=1.0", "safetensors>=0.4"]
quality = ["pyarrow>=17", "scikit-learn>=1.5", "cleanlab>=2.7", "fairlearn>=0.11"]

[project.scripts]
tempera-worker = "tempera_worker.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pyright>=1.1.390", "jsonschema>=4.23", "pyarrow>=17"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tempera_worker"]


[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.11"
include = ["src", "tests"]
# The core CI job type-checks without optional extras (scikit-learn, LightGBM, ...): their imports are
# unresolved there, which must not fail the check. The tabular job resolves them.
reportMissingImports = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tabular: needs the `tabular` extra (skipped when it is not installed)",
    "quality: needs the `quality` extra (skipped when it is not installed)",
]
