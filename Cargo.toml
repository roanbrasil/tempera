[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "UNLICENSED"
repository = "https://github.com/roanbrasil/tempera"
publish = false

[workspace.dependencies]
# internal
tempera-core = { path = "crates/tempera-core" }
tempera-proto = { path = "crates/tempera-proto" }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
serde_path_to_error = "0.1"
schemars = "1"

# errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# async / rpc
tokio = { version = "1", features = ["full"] }
tonic = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
protox = "0.10"

# data
polars = { version = "0.55", default-features = false, features = [
    "lazy", "csv", "parquet", "json", "dtype-datetime", "dtype-date", "dtype-categorical", "approx_unique",
    "temporal", "strings", "is_in", "fmt", "abs", "cum_agg", "rank", "round_series",
] }
sha2 = "0.11"
hex = "0.4"
encoding_rs = "0.8"
tempfile = "3"

# web
axum = { version = "0.8", features = ["ws", "multipart"] }
rust-embed = "8"
mime_guess = "2"

# persistence
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

# cli
clap = { version = "4", features = ["derive", "env"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
# Line tables keep backtraces useful; full debug info for Polars/linfa test
# binaries filled tens of GB.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
