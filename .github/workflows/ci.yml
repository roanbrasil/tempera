name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Polars/linfa test binaries are large; without debug info they fit on the runner disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  python:
    name: Python worker (ruff, pyright, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: workers/python/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q

  python-tabular:
    name: Python worker extras (tabular tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: workers/python/uv.lock
      - run: uv sync --locked --extra tabular --extra quality
      - run: uv run pyright
      - run: uv run pytest -q

  python-llm:
    name: Python worker LLM fine-tuning (CPU)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: workers/python/uv.lock
      - run: uv sync --locked
      # CPU wheels of torch (the locked `llm` extra pulls the CUDA build, several GB). A tiny random
      # model is built inside the tests, so nothing is downloaded from the Hugging Face Hub.
      - run: uv pip install --torch-backend cpu "torch>=2.5" "transformers>=4.46" "peft>=0.13" "accelerate>=1.0" "safetensors>=0.4"
      - run: uv run --no-sync pytest -q tests/test_llm.py -m "not gpu"

  ui:
    name: Web UI (check, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build
