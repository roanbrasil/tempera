# Builds release archives for every supported platform. A `v*` tag publishes
# a GitHub Release with the archives and SHA-256 checksums; a manual run
# (workflow_dispatch) only builds them, as a dry run.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: ui/build
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: ui
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported runner → oldest glibc → widest Linux compatibility.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-13 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-build
          path: ui/build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p tempera-server -p tempera-agent
      - name: Smoke test
        run: |
          target/${{ matrix.target }}/release/tempera --version
          target/${{ matrix.target }}/release/tempera-agent --version
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "$version" == v* ]] || version="dev-${GITHUB_SHA::7}"
          name="tempera-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name/workers"
          cp target/${{ matrix.target }}/release/tempera target/${{ matrix.target }}/release/tempera-agent "dist/$name/"
          # The Python worker sits next to the binaries, where `tempera` looks for it.
          rsync -a --exclude '.venv' --exclude '__pycache__' --exclude '*.egg-info' workers/python "dist/$name/workers/"
          cp -r examples README.md "dist/$name/"
          [ -f LICENSE ] && cp LICENSE "dist/$name/" || true
          [ -f CHANGELOG.md ] && cp CHANGELOG.md "dist/$name/" || true
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "ARCHIVE=dist/$name.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == v0.* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --title "Têmpera $GITHUB_REF_NAME" --notes-file notes.md $prerelease
