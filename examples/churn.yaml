# Binary classification with a planted leak. First run: the audit blocks on
# `refund_amount`. Add it to `data.drop` (already done below) and run again.
version: 1
name: customer-churn
data:
  source: ./data/churn.csv
  target: churned
  time_column: signup_date
  drop: [refund_amount]
task:
  metric: pr_auc
budget:
  max_cost: { amount: 2, currency: USD }
  max_time: 2h
